<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulrike Diermeier | SPD Langquaid</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body class="candidate-page">
    <header class="header">
        <div class="header-container">
            <a href="../index.html" class="back-button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                <span>Alle Kandidat:innen</span>
            </a>
            <div class="logo">
                <a href="../index.html">
                    <svg viewBox="0 0 100 40" class="spd-logo">
                        <rect fill="#E3000F" width="100" height="40" rx="4" />
                        <text x="50" y="28" fill="white" font-size="20" font-weight="bold" text-anchor="middle"
                            font-family="Arial, sans-serif">SPD</text>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main class="candidate-main">
        <div class="candidate-header">
            <span class="candidate-number-large">2</span>
            <h1>Ulrike Diermeier</h1>
            <p class="candidate-details">60 Jahre, Dipl. Sozialpädagogin (FH), Gewerkschaftsmitglied</p>
            <p class="candidate-quote">„ich genieße: Garten, lesen und stricken"</p>
        </div>

        <div class="candidate-gallery">
            <div class="gallery-container">
                <div class="gallery-track">
                    <div class="gallery-slide">
                        <img src="../images/kandidaten/ulrike-diermeier/bild-1.png" alt="ulrike-diermeier - Bild 1">
                    </div>
                    <div class="gallery-slide">
                        <img src="../images/kandidaten/ulrike-diermeier//bild-2.png" alt="ulrike-diermeier - Bild 2">
                    </div>
                    <div class="gallery-slide">
                        <img src="../images/kandidaten/ulrike-diermeier//bild-3.png" alt="ulrike-diermeier - Bild 3">
                    </div>
                </div>
            </div>
            <div class="gallery-pagination">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <svg viewBox="0 0 100 40" class="spd-logo-footer">
                        <rect fill="#E3000F" width="100" height="40" rx="4" />
                        <text x="50" y="28" fill="white" font-size="20" font-weight="bold" text-anchor="middle"
                            font-family="Arial, sans-serif">SPD</text>
                    </svg>
                    <p>SPD Ortsverein Langquaid</p>
                </div>
                <div class="footer-links">
                    <a href="../impressum.html">Impressum</a>
                    <a href="../datenschutz.html">Datenschutz</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 SPD Ortsverein Langquaid. Alle Rechte vorbehalten.</p>
            </div>
        </div>
    </footer>

    <script src="../js/gallery.js"></script>
    <script data-goatcounter="https://spd-lq-kandidaten.goatcounter.com/count" async
        src="//gc.zgo.at/count.js"></script>
</body>

</html>
